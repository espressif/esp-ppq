push_to_github:
  stage: deploy
  extends:
    - .rules:deploy:push_to_github
  when: on_success
  image: espressif/idf:latest
  tags:
    - github_sync
  variables:
    GIT_STRATEGY: clone
    SUBMODULES_TO_FETCH: "none"
  dependencies: []
  before_script:
    - echo "skip default before_script"
  script:
    - |
      if [ -z "${GITHUB_PUSH_TOKEN:-}" ]; then
        echo "ERROR: GITHUB_PUSH_TOKEN is not set or is empty." >&2
        exit 1
      fi
      TOKEN_FINGERPRINT="$(printf '%s' "${GITHUB_PUSH_TOKEN}" | sha256sum | cut -c1-12)"
      echo "GITHUB_PUSH_TOKEN is set (length=${#GITHUB_PUSH_TOKEN}, sha256=${TOKEN_FINGERPRINT}...)."
    - git remote remove github &>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/espressif/esp-ppq.git"
    - source ${CI_PROJECT_DIR}/.gitlab/tool/push_to_github.sh

create_version_tag:
  stage: deploy
  extends:
    - .rules:deploy:create_version_tag
  when: on_success
  image: espressif/idf:latest
  tags:
    - github_sync
  variables:
    GIT_STRATEGY: clone
  dependencies: []
  before_script:
    - pip install toml -q
  script:
    - VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
    - source ${CI_PROJECT_DIR}/.gitlab/tool/create_version_tag.sh
